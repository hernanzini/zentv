name: ZenTV upstream sync

# ZenTV: once a week, merges upstream's main (Gathin23/cleanyourtv) into the branch sync/upstream and opens a pull
# request into main, where CI runs as on any other. Nothing lands without that pull request: main is protected.
#
# Pushing needs the secret ZENTV_SYNC_TOKEN, a fine-grained token for this repository with Contents, Pull requests
# and Workflows set to read and write. The built-in GITHUB_TOKEN cannot push upstream's changes to
# .github/workflows/, and a pull request it opens runs no CI. A merge with conflicts fails this job, and is then
# done by hand (docs/zentv/AGENTS.md, "Keeping up with upstream").
on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zentv-upstream-sync

jobs:
  sync:
    name: Merge upstream into a pull request
    runs-on: ubuntu-latest
    env:
      BRANCH: sync/upstream
      GH_TOKEN: ${{ secrets.ZENTV_SYNC_TOKEN }}
      # gh prefers a remote named upstream: pin it to this repository, so the pull request never goes upstream.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the ZENTV_SYNC_TOKEN secret first (docs/zentv/AGENTS.md, Keeping up with upstream)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ZENTV_SYNC_TOKEN }}
      - name: Merge upstream main
        id: merge
        run: |
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git
          git fetch --quiet upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An open pull request keeps its branch, with any fix pushed to it by hand; otherwise start from main.
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq length)
          if [ "$open" != 0 ]; then
            git switch --quiet -c "$BRANCH" "origin/$BRANCH"
          else
            git switch --quiet -c "$BRANCH"
          fi
          echo "open=$open" >> "$GITHUB_OUTPUT"
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = 0 ]; then
            echo "Already has every upstream commit."
            exit 0
          fi
          if ! git merge --quiet --no-edit -m "Merge upstream main ($(date -u +%F))" upstream/main; then
            echo "::error::$behind upstream commits conflict with ZenTV. Merge them by hand (docs/zentv/AGENTS.md)."
            git diff --name-only --diff-filter=U | sed 's/^/::error::conflict in /'
            exit 1
          fi
          # A branch left from an earlier, merged pull request is replaced.
          git push --quiet --force-with-lease origin "$BRANCH"
      - name: Pull request
        if: steps.merge.outputs.behind != '0' && steps.merge.outputs.open == '0'
        run: |
          cat > "$RUNNER_TEMP/body.md" <<'BODY'
          Upstream's new commits, merged by `.github/workflows/zentv-upstream-sync.yml`.

          Before merging:
          - CI is green.
          - Home works on a real TV with ZenTV's features on (docs/zentv/AGENTS.md).

          Merge with a merge commit, never a squash: the next sync then starts from upstream's history.
          BODY
          gh pr create --base main --head "$BRANCH" --title "Merge upstream main ($(date -u +%F))" \
            --body-file "$RUNNER_TEMP/body.md"
